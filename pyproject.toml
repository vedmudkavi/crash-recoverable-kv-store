[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crash-recoverable-kv-store"
version = "0.2.0"
description = "A crash-recoverable Python key-value database built from first principles"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.scripts]
kvstore = "kvstore.__main__:main"

[tool.setuptools.packages.find]
include = ["kvstore*"]
